name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-and-test:
    # Match the Visual Studio 17 2022 generator in CMakePresets.json.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python -m pip install jinja2

      - name: Test Lua API maintenance tooling
        run: python -m unittest discover -s EngineModules/Scripting/tools/tests

      - name: Test release packaging tools
        run: python -m unittest discover -s tools/editor/packaging/tests -p 'test_*.py'

      - name: Validate Lua API manifest and generated stub
        run: python EngineModules/Scripting/tools/generate_lua_api_stub.py --check

      - name: Configure (Debug preset)
        run: |
          $ciPython = (Get-Command python).Source
          cmake --preset debug "-DPython_EXECUTABLE=$ciPython" "-DPython3_EXECUTABLE=$ciPython"

      - name: Build (Debug)
        run: cmake --build build/debug --config Debug --parallel

      - name: Run smoke tests
        run: ctest --test-dir build/debug -C Debug -L smoke --output-on-failure

      - name: Run integration tests
        run: ctest --test-dir build/debug -C Debug -L integration -LE windowed --output-on-failure

  editor-tests:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run editor unit tests
        working-directory: tools/editor
        run: .\gradlew.bat test --no-daemon --console=plain

      - name: Upload editor test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-test-reports
          path: |
            tools/editor/build/reports/tests/test/
            tools/editor/build/test-results/test/
          if-no-files-found: warn
